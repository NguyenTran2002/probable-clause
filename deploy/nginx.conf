# The web service's nginx, production profile (T3.5, T4.2, T5.5). Written from scratch; no goodnight code.
# Directive behaviour from https://nginx.org/en/docs/http/ngx_http_headers_module.html and
# https://nginx.org/en/docs/http/ngx_http_proxy_module.html, read Oct 24, 2026.
#
# Paths: goodnight routes /probable-clause/ to this service with the prefix stripped (T3.5), so the site
# root here is the page's root. The page calls api/... relative to its own URL; in production goodnight
# sends /probable-clause/api/ to the API, so there is no proxy in this profile.
# Port: Cloud Run is told --port=8080 by deploy.sh.

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    charset utf-8;

    # T3.7: no client address is stored by our services. Cloud Run keeps its own request logs.
    access_log off;

    # Own table, so correct types do not depend on the image's mime.types. Modules need a JavaScript type.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json;
        image/svg+xml             svg;
        image/x-icon              ico;
        font/woff2                woff2;
        text/plain                txt;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        autoindex off;

        # Every response: revalidate by ETag on each load, replacing ?v= strings (T4.2). `always` adds it to
        # error responses too. add_header is inherited by a location only if the location has no add_header
        # of its own, so these live here and no location below defines one.
        add_header Cache-Control "no-cache" always;
        # T5.5: the page contacts no third party. Fonts are our own .woff2 files; links out are navigation,
        # which this policy does not restrict. style-src allows inline styles because the page's code sets style
        # attributes; scripts stay 'self' only, so no inline or third-party script runs. A proposal for the user.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # A file, or a directory's index.html; never a directory listing
        location / {
            try_files $uri $uri/index.html =404;
        }

        # Dotfiles are never served
        location ~ /\. {
            return 404;
        }
    }
}
