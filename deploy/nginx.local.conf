# The web service's nginx, LOCAL profile for the user's local review (P4.1): the production profile
# (nginx.conf) plus one location, /api/, proxied to the API container with the prefix stripped.
# Otherwise identical to nginx.conf (tests/deploy checks this). Run with: nginx -c /etc/nginx/nginx.local.conf
# Written from scratch; no goodnight code (T3.5). Directive behaviour from
# https://nginx.org/en/docs/http/ngx_http_proxy_module.html and
# https://nginx.org/en/docs/http/ngx_http_headers_module.html, read Oct 24, 2026.
#
# The page calls api/... relative to its own URL: http://localhost:8080/api/ here (same origin, no CORS).
# The API container is named pc-api-local on the Docker network that deploy/local.sh creates.

worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    charset utf-8;

    # T3.7: no client address is stored by our services. Cloud Run keeps its own request logs.
    access_log off;

    # Own table, so correct types do not depend on the image's mime.types. Modules need a JavaScript type.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json;
        image/svg+xml             svg;
        image/x-icon              ico;
        font/woff2                woff2;
        text/plain                txt;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        autoindex off;

        # Docker's embedded DNS, for the variable upstream below
        resolver 127.0.0.11 valid=10s;

        # Every response: revalidate by ETag on each load, replacing ?v= strings (T4.2). `always` adds it to
        # error responses too. add_header is inherited by a location only if the location has no add_header
        # of its own, so these live here and no location below defines one.
        add_header Cache-Control "no-cache" always;
        # T5.5: the page contacts no third party. Fonts are our own .woff2 files; links out are navigation,
        # which this policy does not restrict. style-src allows inline styles because the page's code sets style
        # attributes; scripts stay 'self' only, so no inline or third-party script runs. A proposal for the user.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # The API, prefix stripped. Server-Sent Events (T3.1): buffering and caching off, no gzip, and a read
        # timeout equal to the API's request timeout (api/settings.py API_REQUEST_TIMEOUT_S, 900 s), which
        # is longer than a run and than the API's 15 s keep-alive. No X-Forwarded-For (T3.5, T3.7).
        # The upstream is a variable so nginx starts even when the API container is not up yet.
        location /api/ {
            set $api_upstream pc-api-local:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 900s;
            proxy_send_timeout 60s;
        }

        # A file, a page by its name without .html (sources-and-credits, privacy), or a directory's index.html;
        # never a directory listing
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }

        # Dotfiles are never served
        location ~ /\. {
            return 404;
        }
    }
}
